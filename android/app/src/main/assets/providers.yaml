# DOC-013 §1 — launch-set provider registry. ProvidersModule (T-167) reads this file directly and
# builds one real Provider per entry that has BOTH a real adapter for its `kind` and a configured
# key in SecretVault — this file alone now genuinely drives the registry (NFR-10), not just docs.
#
# `kind: openai_compat`, `kind: google`, and `kind: anthropic` have real adapters
# (OpenAiCompatProvider, GeminiProvider, AnthropicProvider) — an entry with any other `kind` would
# be honest about being unbuilt, not silently wrong, but there are none right now: `local`/
# on-device-LAN entries were removed here rather than left unbuilt-but-listed, since that mismatch
# (file claims a provider is configured; nothing in code can actually build one) is exactly the bug
# this file used to have. Adding real support for either back means writing the adapter class
# first (see BACKLOG.md), then re-adding the entry — not the other way around.
providers:
  - id: groq
    kind: openai_compat
    endpoint: https://api.groq.com/openai/v1
    models: [llama-3.3-70b-versatile]
    caps:
      tools: true
      context: 32768
      stream: true
    tier: free
    privacy: cloud

  - id: openrouter
    kind: openai_compat
    endpoint: https://openrouter.ai/api/v1
    models: [tencent/hy3:free]
    caps:
      tools: true
      context: 32768
      stream: true
    tier: free
    privacy: cloud

  - id: nvidia
    kind: openai_compat
    endpoint: https://integrate.api.nvidia.com/v1
    # The 70B variant hung indefinitely on this account (verified via direct curl) — this 8B one
    # responds in well under a second; swap once the larger one's availability is confirmed.
    models: [meta/llama-3.1-8b-instruct]
    caps:
      tools: true
      context: 8192
      stream: true
    tier: free
    privacy: cloud

  - id: gemini
    kind: google
    endpoint: https://generativelanguage.googleapis.com/v1beta
    # gemini-2.5-flash 404s as "no longer available to new users" on this key (verified via direct
    # curl); 2.0-flash is the broadest-available fallback. Real metered API — PAID, not FREE, so
    # ScoringMath's daily budget cap actually applies to it (T-167 finding).
    models: [gemini-2.0-flash]
    caps:
      vision: true
      tools: true
      context: 1048576
      stream: true
    cost:
      in: 0.075
      out: 0.30
    tier: paid
    privacy: cloud

  - id: openai
    kind: openai_compat
    endpoint: https://api.openai.com/v1
    models: [gpt-4o-mini]
    caps:
      vision: true
      tools: true
      context: 128000
      stream: true
    cost:
      in: 0.15
      out: 0.60
    tier: paid
    privacy: cloud

  - id: deepseek
    kind: openai_compat
    endpoint: https://api.deepseek.com/v1
    models: [deepseek-chat]
    caps:
      tools: true
      context: 64000
      stream: true
    cost:
      in: 0.28
      out: 0.42
    tier: paid
    privacy: cloud

  - id: anthropic
    kind: anthropic
    endpoint: https://api.anthropic.com/v1
    models: [claude-haiku-4-5-20251001]
    caps:
      vision: true
      tools: true
      context: 200000
      stream: true
    cost:
      in: 1.00
      out: 5.00
    tier: paid
    privacy: cloud
