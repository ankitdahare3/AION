# DOC-013 §1 — launch-set provider registry. Adapters (T-031) read this to build the actual
# Provider instances passed to ProviderRouter; this file alone changes nothing in-app.
providers:
  - id: local-llamacpp
    kind: local
    models: [qwen3-4b-int4]
    caps:
      vision: false
      tools: true
      context: 8192
      stream: true
    tier: local
    privacy: on_device

  - id: groq
    kind: openai_compat
    endpoint: https://api.groq.com/openai/v1
    models: [llama-3.3-70b-versatile]
    caps:
      tools: true
      context: 32768
      stream: true
    cost:
      in: 0.05
      out: 0.08
    tier: free
    privacy: cloud

