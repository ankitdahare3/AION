[versions]
# AGP 8.9.1+ required for compileSdk 36 (TECH_SPEC freezes targetSdk 36); AGP 8.11.x needs Gradle 8.13
# Deliberately NOT on the AGP 9.x / Gradle 9.x line yet (current as of 2026-07): that jump brings
# breaking DSL changes and needs re-verification we can't do without an emulator/device on this
# machine. 8.11.1 is the verified-working baseline (T-001) — revisit for T-003 CI or when the
# owner has a device to test against.
agp = "8.11.1"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.2"
# Hilt 2.59+ dropped AGP 8.x support (requires AGP 9.0.0+, which we're deliberately not on yet —
# see the agp version comment above). 2.58 is the last release compatible with AGP 8.11.1.
hilt = "2.58"
composeBom = "2025.06.01"
activityCompose = "1.9.2"
# 2.6.1 (original scaffold pin) generates broken Java stubs for suspend DAO methods under
# Kotlin 2.1.x/KSP2 (name-clash errors on Continuation<? super T>) — Room only fixed K2/KSP2
# interop properly from 2.7.0 onward. Bumped to the latest stable.
room = "2.8.4"
workManager = "2.9.1"
kotlinxSerializationJson = "1.7.3"
kotlinxCoroutines = "1.10.1"
junit = "4.13.2"
ktlint = "14.2.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
securityCrypto = "1.1.0"
# kaml has no such constraint (pure text/YAML parsing, no compiled-metadata coupling).
kaml = "0.104.0"
# Ktor 3.1.3+ moved to Kotlin 2.2/2.3 (compiled .kotlin_module metadata becomes binary-incompatible
# with our Kotlin 2.1.21 pin — "Module was compiled with an incompatible version of Kotlin").
# 3.1.2 is the last release built against Kotlin 2.1.20, matching our project's Kotlin version.
ktor = "3.1.2"
# Shizuku-api: stable, rarely-updated shell-exec bridge (T-043). Pre-API28 ContentProvider
# fallback deliberately not added — minSdk 31 doesn't need it.
shizuku = "13.1.5"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
kaml = { group = "com.charleskorn.kaml", name = "kaml", version.ref = "kaml" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Mandatory since Kotlin 2.0 wherever buildFeatures.compose = true
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
